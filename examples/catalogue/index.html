<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carbon Browser Demo Catalogue</title>
    <link rel="stylesheet" href="../../src/theme/eve.css">
    <link rel="stylesheet" href="../../src/market/ui/market-window.css">
    <link rel="stylesheet" href="../../src/ship-show-info/ui/ship-show-info.css">
    <link rel="stylesheet" href="../../src/ship-tree/ui/ship-tree.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
            background: #020606;
        }

        .catalogue-nav {
            display: flex;
            gap: 1px;
            padding: 6px;
            border-bottom: 1px solid var(--cjs-eve-line);
            background: var(--cjs-eve-surface-deep);
        }

        #demo-root {
            min-width: 0;
            min-height: 0;
        }
    </style>
</head>
<body class="cjs-eve-theme">
    <nav class="catalogue-nav" aria-label="Browser demos">
        <button class="cjs-eve-button" type="button" data-demo-id="ship-show-info">Ship Show Info</button>
        <button class="cjs-eve-button" type="button" data-demo-id="market-details">Market Details</button>
        <button class="cjs-eve-button" type="button" data-demo-id="ship-tree">Ship Tree</button>
    </nav>
    <main id="demo-root"></main>
    <script type="module" src="./main.js"></script>
</body>
</html>
