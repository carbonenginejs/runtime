<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>runtime-audio demo — authored SFX, music, and media delivery</title>
<style>
  body { font: 13px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; display: grid; grid-template-columns: 340px 1fr; height: 100vh; background: #0b0e14; color: #cdd6e4; }
  #panel { padding: 14px; overflow-y: auto; border-right: 1px solid #1e2633; }
  .hint { color: #7c8797; margin: 0 0 10px; }
  button { background: #1d4ed8; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:disabled { background: #334155; cursor: default; }
  input[type=search] { width: 100%; box-sizing: border-box; padding: 7px; margin: 0 0 6px; background: #131a26; color: #cdd6e4; border: 1px solid #2a3648; border-radius: 6px; }
  select { width: 100%; box-sizing: border-box; padding: 5px 7px; background: #131a26; color: #cdd6e4; border: 1px solid #2a3648; border-radius: 6px; font-size: 12px; }
  #events { list-style: none; margin: 0; padding: 0; }
  #events li { padding: 5px 7px; border-radius: 5px; cursor: pointer; display: grid; grid-template-columns: 1fr 68px 52px; gap: 8px; align-items: baseline; }
  #events li:hover { background: #182234; }
  #events li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #events .kind, #events .radius { color: #64748b; white-space: nowrap; text-align: right; font-size: 11px; }
  #stage { position: relative; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #hud { position: absolute; top: 10px; left: 12px; color: #94a3b8; }
  #musicHud { position: absolute; top: 30px; left: 12px; color: #a78bfa; white-space: nowrap; }
  #controls { position: absolute; top: 10px; right: 12px; width: 252px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: rgba(13,18,28,0.92); border: 1px solid #2a3648; border-radius: 8px; padding: 10px 12px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #7c8797; margin: 0 0 6px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .headingActions { display: inline-flex; align-items: center; gap: 8px; }
  .fieldRow { display: flex; align-items: center; gap: 7px; }
  .fieldRow select { flex: 1; min-width: 0; }
  .infoButton { position: relative; flex: 0 0 auto; width: 17px; height: 17px; padding: 0; border: 1px solid #52647d; border-radius: 50%; background: transparent; color: #94a3b8; font: 600 11px/15px Georgia, serif; text-align: center; text-transform: none; letter-spacing: 0; cursor: help; }
  .infoButton:hover, .infoButton:focus-visible { border-color: #7ea2d8; color: #cdd6e4; outline: none; }
  .infoButton::after { content: attr(data-tip); position: absolute; display: block; visibility: hidden; opacity: 0; top: calc(100% + 7px); right: -1px; width: 225px; box-sizing: border-box; padding: 8px 10px; border: 1px solid #2a3648; border-radius: 6px; background: rgba(13,18,28,0.98); color: #cdd6e4; font: 11px/1.55 system-ui, "Segoe UI", sans-serif; letter-spacing: 0; text-align: left; text-transform: none; white-space: pre-line; pointer-events: none; z-index: 20; transition: opacity 100ms ease; }
  .infoButton.tipUp::after { top: auto; bottom: calc(100% + 7px); }
  .infoButton:hover::after, .infoButton:focus::after { visibility: visible; opacity: 1; }
  #tip { position: absolute; display: none; background: rgba(13,18,28,0.94); border: 1px solid #2a3648;
         border-radius: 6px; padding: 8px 10px; font-size: 11px; line-height: 1.55; color: #cdd6e4;
         pointer-events: none; white-space: pre; z-index: 5; }
  #tip .tipTitle { color: #7ea2d8; }
  label { color: #94a3b8; }
  #mixTable { margin: 0; border-collapse: collapse; }
  #mixTable td { padding: 2px 8px 2px 0; color: #94a3b8; white-space: nowrap; font-size: 12px; }
  #mixTable input[type=range] { width: 130px; vertical-align: middle; }
  .buttonRow { display: flex; gap: 6px; margin-top: 7px; }
  .buttonRow button { flex: 1; padding: 6px 8px; font-size: 12px; }
  #musicRetry { width: 100%; margin-top: 7px; padding: 6px 8px; font-size: 12px; }
  #sfxStatus { color: #7dd3fc; font-size: 11px; line-height: 1.4; margin-top: 7px; }
  #sfxControls:empty { display: none; }
  .sfxControl { display: block; margin-top: 7px; color: #94a3b8; font-size: 11px; }
  .sfxControl select, .sfxControl input[type=range] { width: 100%; }
  .sfxControl output { float: right; color: #7dd3fc; }
  .loop { color: #34d399; } .vital { color: #f59e0b; } .flat { color: #64748b; }
</style>
</head>
<body>
<div id="panel">
  <input id="search" type="search" placeholder="filter effects… (try: engine, warp, artillery)">
  <ul id="events"></ul>
</div>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="hud"></div>
  <div id="musicHud"></div>
  <div id="tip"></div>
  <div id="controls">
    <div class="card">
      <h2>audio <span class="headingActions"><button class="infoButton" type="button" aria-label="About audio controls" data-tip="Enable starts browser audio. Max awake limits active emitters; the engine culls the rest. Volumes control the SFX and music buses. Ring opacity, world scale, and cull rings change only this visualization.">i</button><input id="enable" type="checkbox" title="enable audio"></span></h2>
      <table id="mixTable">
        <tr><td>demo</td><td><input id="demoToggle" type="checkbox" title="load the demo scene"></td></tr>
        <tr><td>max awake</td><td><input id="maxAwake" type="range" min="1" max="75" value="6"></td></tr>
        <tr><td>sfx volume</td><td><input id="sfxVol" type="range" min="0" max="100" value="100"></td></tr>
        <tr><td>music volume</td><td><input id="musicVol" type="range" min="0" max="100" value="75"></td></tr>
        <tr><td>ring opacity</td><td><input id="ringAlpha" type="range" min="0" max="60" value="10"></td></tr>
        <tr><td>world scale</td><td><input id="worldScale" type="range" min="25" max="400" value="100"></td></tr>
        <tr><td>cull rings</td><td><input id="cullRings" type="checkbox"></td></tr>
      </table>
    </div>
    <div class="card" id="music" style="display:none">
      <h2>dynamic music <span class="headingActions"><button class="infoButton" type="button" aria-label="About dynamic music" data-tip="Plays the real EVE music graph. Changing mood steers its authored switch container; runtime-audio chooses and schedules the resulting music nodes.">i</button><input id="musicToggle" type="checkbox" title="play dynamic music"></span></h2>
      <select id="moods" title="mood"></select>
      <button id="musicRetry" type="button" hidden>retry music</button>
    </div>
    <div class="card" id="jukebox">
      <h2>classic jukebox <button class="infoButton" type="button" aria-label="About the classic jukebox" data-tip="Plays 75 titled tracks supplied as a separate, optional music library. Download the demo tracks with npm run demo:music before starting this demo. Unavailable tracks are not offered for playback.">i</button></h2>
      <select id="jukeboxTracks" title="classic EVE track"></select>
      <div class="buttonRow">
        <button id="jukeboxPrevious" type="button" title="previous track">previous</button>
        <button id="jukeboxPlay" type="button">play</button>
        <button id="jukeboxPause" type="button">pause</button>
        <button id="jukeboxNext" type="button" title="next track">next</button>
      </div>
      <div id="jukeboxStatus" class="hint" style="margin-top:6px">enable audio to use the jukebox</div>
    </div>
    <div class="card" id="sfx" style="display:none">
      <h2>authored SFX</h2>
      <div class="fieldRow">
        <select id="sfxExamples" title="authored SFX example"></select>
        <button id="sfxInfo" class="infoButton" type="button" aria-label="About the selected authored SFX example" data-tip="">i</button>
      </div>
      <div id="sfxControls"></div>
      <div class="buttonRow">
        <button id="sfxPost" type="button">post again</button>
        <button id="sfxReset" type="button">reset object</button>
      </div>
      <div class="fieldRow">
        <label for="delivery">media delivery</label>
        <button class="infoButton tipUp" type="button" aria-label="About media delivery" data-tip="Chooses how runtime-audio receives WEM bytes: automatic selection, an individual file, an exact byte range from the original bank, or the whole original bank with a local slice.">i</button>
      </div>
      <select id="delivery" title="CjsAudioMan media delivery">
        <option value="auto">auto</option>
        <option value="individual">individual file</option>
        <option value="range">exact bank range</option>
        <option value="whole">whole bank + local slice</option>
      </select>
      <div id="sfxStatus"></div>
    </div>
    <div class="card">
      <h2>scene controls <button class="infoButton tipUp" type="button" aria-label="About scene controls and markers" data-tip="Click a library item to play it.&#10;Drag the listener, an emitter, or empty space to move around.&#10;Right-click an emitter to remove it.&#10;Wheel over an emitter to scale it; Alt + wheel rotates it. Wheel elsewhere zooms.&#10;&#10;Blue tick: effective direction&#10;White ring: hearing range&#10;Blue ring: engine cull range&#10;Purple: authored SFX (hollow when idle)&#10;Green: placed · amber: demo · grey: culled&#10;&#10;Hover any circle for its live engine details.">i</button></h2>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "@carbonenginejs/runtime-utils/schema": "/runtime-utils/src/schema/index.js",
    "@carbonenginejs/runtime-utils/model": "/runtime-utils/src/model/index.js",
    "@carbonenginejs/runtime-utils/quat": "/runtime-utils/src/quat.js",
    "@carbonenginejs/runtime-utils/vec3": "/runtime-utils/src/vec3.js",
    "@carbonenginejs/runtime-utils/graphics": "/runtime-utils/src/graphics/index.js",
    "@carbonenginejs/runtime-resource/formats/wem": "/runtime-resource/npm/dist/formats/wem/index.js",
    "gl-matrix/": "/runtime-utils/node_modules/gl-matrix/"
  }
}
</script>
<script type="module" src="/runtime-audio/demo/demo.js"></script>
</body>
</html>
