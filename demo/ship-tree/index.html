<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carbon Browser Ship Tree</title>
    <link rel="stylesheet" href="../../src/tools/theme/eve.css">
    <link rel="stylesheet" href="../../src/tools/ship-tree/ui/ship-tree.css">
    <style>
        html,
        body,
        #ship-tree-root {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #020606;
        }

        #selection-status {
            position: fixed;
            right: 12px;
            bottom: 10px;
            z-index: 2;
            margin: 0;
            color: #899794;
            font: 12px "Segoe UI", sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <main id="ship-tree-root"></main>
    <p id="selection-status" aria-live="polite"></p>
    <script type="module" src="./main.js"></script>
</body>
</html>
