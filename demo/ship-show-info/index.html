<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carbon Ship Show Info</title>
    <link rel="stylesheet" href="../../src/tools/theme/eve.css">
    <link rel="stylesheet" href="../../src/tools/ship-show-info/ui/ship-show-info.css">
    <style>
        html,
        body,
        #demo-root {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #020606;
        }

        .ship-show-info-demo-error {
            box-sizing: border-box;
            width: min(560px, calc(100% - 40px));
            margin: 12vh auto;
            padding: 24px;
            color: #b8c7c6;
            border: 1px solid rgba(145, 190, 188, .25);
            background: rgba(5, 11, 12, .94);
            font: 14px/1.5 sans-serif;
        }

        .ship-show-info-demo-error h1 {
            margin-top: 0;
            color: #d8e5e4;
            font-weight: 500;
        }

        .ship-show-info-demo-error a {
            color: #76bac1;
        }
    </style>
</head>
<body class="cjs-eve-theme">
    <main id="demo-root"></main>
    <script type="module" src="./main.js"></script>
</body>
</html>
