  # 1 of 1; kinds: string; values: "MOVING"; example: res:/animation/movementstates.yaml
  "name":
    string
  # 1 of 1; kinds: boolean; values: true; example: res:/animation/movementstates.yaml
  "startsEnabled":
    bool
  # 1 of 1; kinds: number; values: 1.6; example: res:/animation/movementstates.yaml
  "baseSpeed":
    float
  # 1 of 1; kinds: number; values: 2; example: res:/animation/movementstates.yaml
  "runningMod":
    float
  # 1 of 1; kinds: sequence; lengths: 9; example: res:/animation/movementstates.yaml
  "staticStates":
    # Repeated item: 9 of 9; kinds: map; example: res:/animation/movementstates.yaml
    -
      # Nested key-set variant: 7 of 9; map ["camOffset","heading","minSpeed","name","rotSpeed","speed","transitions"]; example: res:/animation/movementstates.yaml
      # Nested key-set variant: 1 of 9; map ["heading","name","rotSpeed","speed","transitions"]; example: res:/animation/movementstates.yaml
      # Nested key-set variant: 1 of 9; map ["heading","minSpeed","name","rotSpeed","speed","transitions"]; example: res:/animation/movementstates.yaml
      # 9 of 9; kinds: string; values: "IDLE", "FORWARD", "LEFT", "RIGHT", "FORWARD_LEFT", "FORWARD_RIGHT", "BACKWARD", "BACKWARD_LEFT", "BACKWARD_RIGHT"; example: res:/animation/movementstates.yaml
      "name":
        string
      # 9 of 9; kinds: number; values: 0, 1; example: res:/animation/movementstates.yaml; written as a YAML alias to an earlier identical value in the same file in 7 of 9 occurrences (anchors &FULL_SPEED); alias example: res:/animation/movementstates.yaml
      "speed":
        float
      # 9 of 9; kinds: sequence; lengths: 3; example: res:/animation/movementstates.yaml
      "heading":
        # Item 0: 9 of 9; kinds: number; values: 0; example: res:/animation/movementstates.yaml
        # Item 1: 9 of 9; kinds: number; values: 0; example: res:/animation/movementstates.yaml
        # Item 2: 9 of 9; kinds: number; values: 0, 1; example: res:/animation/movementstates.yaml
        [float, float, float]
      # 9 of 9; kinds: number; values: 0, 360; example: res:/animation/movementstates.yaml; written as a YAML alias to an earlier identical value in the same file in 7 of 9 occurrences (anchors &STANDARD_ROTATION); alias example: res:/animation/movementstates.yaml
      "rotSpeed":
        float
      # 9 of 9; kinds: sequence; lengths: 1, 11, 12; example: res:/animation/movementstates.yaml
      "transitions":
        # Repeated item: 93 of 93; kinds: map; example: res:/animation/movementstates.yaml
        -
          # Nested key-set variant: 84 of 93; map ["blendTime","executeRotation","fromState","maxInterruptPercent","targetRotation","tolerance"]; example: res:/animation/movementstates.yaml
          # Nested key-set variant: 9 of 93; map ["blendTime","maxInterruptPercent"]; example: res:/animation/movementstates.yaml
          # 93 of 93; kinds: number; values: 0.5, 0.3, 0.7; example: res:/animation/movementstates.yaml; written as a YAML alias to an earlier identical value in the same file in 90 of 93 occurrences (anchors &STANDARD_BLEND_TIME, &ONE_EIGHTY_BLEND_TIME); alias example: res:/animation/movementstates.yaml
          "blendTime":
            float
          # 93 of 93; kinds: number; values: 0; example: res:/animation/movementstates.yaml; written as a YAML alias to an earlier identical value in the same file in 91 of 93 occurrences (anchors &STANDARD_INTERRUPT); alias example: res:/animation/movementstates.yaml
          "maxInterruptPercent":
            float
          # 84 of 93; kinds: string; values: "IDLE", "FORWARD", "BACKWARD", "LEFT", "RIGHT", "FORWARD_LEFT", "FORWARD_RIGHT", "BACKWARD_LEFT", "BACKWARD_RIGHT"; example: res:/animation/movementstates.yaml
          "fromState":
            string
          # 84 of 93; kinds: number; distinct scalar values: 24; range: 0 .. 348.75; example: res:/animation/movementstates.yaml
          "targetRotation":
            float|int
          # 84 of 93; kinds: number; values: 22.5, 11.25, 45; example: res:/animation/movementstates.yaml
          "tolerance":
            float
          # 84 of 93; kinds: number; values: 45, -45, 90, -90, 135, -135, -180, 180; example: res:/animation/movementstates.yaml
          "executeRotation":
            float
      # 8 of 9; kinds: number; values: 0.4; example: res:/animation/movementstates.yaml; written as a YAML alias to an earlier identical value in the same file in 7 of 8 occurrences (anchors &STANDARD_MIN_SPEED); alias example: res:/animation/movementstates.yaml
      "minSpeed":
        float
      # 7 of 9; kinds: number; values: 90, 270, 45, 315, 180, 135, 225; example: res:/animation/movementstates.yaml
      "camOffset":
        float
  # 1 of 1; kinds: sequence; lengths: 18; example: res:/animation/movementstates.yaml
  "keymaplist":
    # Repeated item: 18 of 18; kinds: map; example: res:/animation/movementstates.yaml
    -
      # 18 of 18; kinds: sequence; lengths: 3; example: res:/animation/movementstates.yaml
      "input":
        # Item 0: 18 of 18; kinds: number; values: 0, 1, -1; example: res:/animation/movementstates.yaml
        # Item 1: 18 of 18; kinds: number; values: 0, 1, -1; example: res:/animation/movementstates.yaml
        # Item 2: 18 of 18; kinds: number; values: 0, 1; example: res:/animation/movementstates.yaml
        [int, int, int]
      # 18 of 18; kinds: string; values: "IDLE", "FORWARD", "BACKWARD", "LEFT", "FORWARD_LEFT", "BACKWARD_LEFT", "RIGHT", "FORWARD_RIGHT", "BACKWARD_RIGHT"; example: res:/animation/movementstates.yaml
      "state":
        string
