<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon cloud test</title>
<style>
  @font-face { font-family: "Eve Sans Neue"; src: url("/resource/ui/fonts/evesansneue-regular.otf") format("opentype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Eve Sans Neue"; src: url("/resource/ui/fonts/evesansneue-bold.otf") format("opentype"); font-weight: 700; font-display: swap; }
  :root { color-scheme: dark; font: 14px/1.5 "Eve Sans Neue", system-ui, sans-serif; background: #10151e; color: #e5edf8; }
  * { box-sizing: border-box; }
  body { margin: 0; display: grid; grid-template-columns: minmax(0,1fr) 340px; height: 100vh; }
  main { position: relative; min-height: 300px; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  aside { padding: 24px; overflow: auto; border-left: 1px solid #2d394a; }
  h1 { font-size: 23px; margin: 0 0 8px; font-weight: 700; }
  p { color: #a4b4c9; margin: 8px 0 22px; }
  label { display: block; margin-top: 16px; }
  select, button { color: inherit; background: #1e2b3d; border: 1px solid #40546c; border-radius: 6px; padding: 9px 12px; font: inherit; }
  select { width: 100%; margin-top: 5px; }
  button { cursor: pointer; margin: 14px 6px 0 0; }
  button:disabled { opacity: .4; cursor: default; }
  input { accent-color: #84bfff; }
  #status { color: #b8d9ff; padding: 12px 0; border-bottom: 1px solid #2d394a; }
  pre { font-family: inherit; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; line-height: 1.6; color: #b2c1d4; }
  .hint { position: absolute; bottom: 16px; left: 20px; padding: 6px 10px; background: #10151ed9; color: #b2c1d4; border-radius: 5px; pointer-events: none; }
  @media(max-width: 800px) { body { height: auto; grid-template-columns: 1fr; } main { height: 65vh; } aside { border-left: 0; } }
</style>
</head>
<body>
<main><canvas id="view" aria-label="Cloud rendering viewport"></canvas><div class="hint">Drag to orbit · wheel to dolly</div></main>
<aside>
  <h1>Cloud test</h1>
  <p>Legacy and Cloud2 through the scene’s volumetric passes.</p>
  <label>Authored case<select id="case"></select></label>
  <div id="status" role="status">Loading module…</div>
  <fieldset id="controls" disabled style="border:0;padding:0;margin:0">
    <label>Volumetric quality<select id="quality"><option>Low</option><option>Medium</option><option selected>High</option><option>Ultra</option></select></label>
    <label><input id="blur" type="checkbox" checked> Blur</label>
    <label><input id="shadows" type="checkbox"> Shadows (low)</label>
    <button id="pause">Pause</button><button id="frame">Frame cloud</button>
  </fieldset>
  <button id="copy">Copy diagnostics</button>
  <p style="font-size:12px;margin-top:16px">Inspect the canvas. Counters include full-screen passes and do not certify a visible cloud. Change case to reload.</p>
  <pre id="diagnostics"></pre>
</aside>
<script type="module">
  const status = document.getElementById("status"), diagnostics = document.getElementById("diagnostics");
  let latest = { stage: "Loading module" }, demo;
  const report = state => { latest = state; status.textContent = state.stage; diagnostics.textContent = JSON.stringify(state, null, 2); };
  let pendingError = null;
  const fail = error => {
    pendingError = error;
    if (demo) demo.fail(error);
    else report({ ...latest, stage: "Failed", errors: [...(latest.errors || []), String(error)] });
  };
  window.addEventListener("error", event => fail(event.error || event.message));
  window.addEventListener("unhandledrejection", event => fail(event.reason));
  document.getElementById("copy").onclick = async event => {
    try { await navigator.clipboard.writeText(diagnostics.textContent); event.target.textContent = "Copied"; }
    catch { event.target.textContent = "Select diagnostics to copy"; }
  };
  try {
    const { CLOUD_CASES, runCloudDemo } = await import("./clouds.bundle.js");
    const cases = document.getElementById("case");
    for (const [value, item] of Object.entries(CLOUD_CASES)) cases.add(new Option(item.label, value));
    cases.value = new URLSearchParams(location.search).get("case") || "legacy";
    cases.onchange = () => { const url = new URL(location.href); url.searchParams.set("case", cases.value); location.href = url.href; };
    demo = await runCloudDemo(document.getElementById("view"), report);
    if (pendingError) demo.fail(pendingError);
    document.getElementById("controls").disabled = false;
    document.getElementById("blur").checked = demo.scene.volumetricsRenderer.blur;
    document.getElementById("quality").onchange = event => demo.setQuality(event.target.value);
    document.getElementById("blur").onchange = event => demo.setBlur(event.target.checked);
    document.getElementById("shadows").onchange = event => demo.setShadows(event.target.checked);
    let paused = false;
    document.getElementById("pause").onclick = event => { paused = !paused; demo.pause(paused); event.target.textContent = paused ? "Resume" : "Pause"; };
    document.getElementById("frame").onclick = () => demo.controls.frame();
    document.getElementById("frame").disabled = cases.value === "interior";
  } catch (error) { report({ ...latest, stage: "Failed", errors: [...(latest.errors || []), error.stack || String(error)] }); console.error(error); }
</script>
</body>
</html>
